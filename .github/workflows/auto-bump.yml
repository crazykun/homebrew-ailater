name: Auto-bump formulas

# 定时轮询各上游仓库最新 Release，Formula 版本落后时自动更新
# version + 各资产 url/sha256，commit & push。
# 使用本仓库自带 GITHUB_TOKEN（contents:write），无需任何 PAT。
#
# 新增 formula 只需在 FORMULAS 表加一行 "formula名:上游仓库"。
# 资产文件名（含内嵌版本号的命名，如 foo-v1.2.3-x86_64.tar.gz）自动推算并校验。

on:
  schedule:
    - cron: "23 * * * *" # 每小时 :23（错峰）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check and bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # formula 名 : 上游仓库（crazykun/ 前缀省略）
          FORMULAS=(
            "glmeter:GLMeter"
            "lscreen:LaterScreen"
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for entry in "${FORMULAS[@]}"; do
            NAME="${entry%%:*}"
            UPSTREAM="crazykun/${entry##*:}"
            FORMULA="Formula/${NAME}.rb"
            echo "=== $NAME <- $UPSTREAM ==="

            LATEST=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName | sed 's/^v//')
            CURRENT=$(grep -oP '(?<=^  version ")[^"]+' "$FORMULA")
            echo "formula=$CURRENT latest=$LATEST"

            if [ "$LATEST" = "$CURRENT" ]; then
              echo "Up to date, skip."
              continue
            fi

            gh release view --repo "$UPSTREAM" --json assets -q '.assets[].name' > /tmp/assets.txt

            python3 .github/scripts/bump_formula.py \
              "$FORMULA" "$UPSTREAM" "$CURRENT" "$LATEST" /tmp/assets.txt

            git add "$FORMULA"
            git commit -m "${NAME} ${LATEST}"
            echo "Bumped $NAME $CURRENT -> $LATEST"
          done

          AHEAD=$(git rev-list --count @{u}..HEAD)
          if [ "$AHEAD" -gt 0 ]; then
            git push
            echo "Pushed $AHEAD commit(s)."
          else
            echo "Nothing to push."
          fi
